[controller]
controller_ip = 192.168.0.101
controller_port = 6653
of_protocol_version = OpenFlow13

[network]
num_switches = 6
hosts_per_switch = 3
base_ip = 10.0.0.0/24
switch_protocol = OpenFlow13

[paths]
data_dir = ./data
flow_stats_file = ./data/FlowStatsfile.csv
predict_flow_stats_file = ./data/PredictFlowStatsfile.csv
dataset_file = ./data/dataset.csv
webserver_dir = /home/mininet/webserver
downloads_dir = /home/mininet/Downloads

[training]
test_size = 0.25
random_state = 42
n_estimators = 100
criterion = entropy

[detection]
stats_request_interval = 10
legitimate_traffic_threshold = 80

[mitigation]
block_duration = 120
flow_priority_mitigation = 100
flow_priority_normal = 1

[logging]
level = INFO
format = %(asctime)s - %(name)s - %(levelname)s - %(message)s
file = ./logs/ddos_detection.log

[traffic_generation]
benign_iterations = 600
benign_requests_per_iteration = 10
ddos_attack_duration = 20
ddos_sleep_between_attacks = 100

# ML Service settings (also configurable via .env)
[ml_service]
service_host = 0.0.0.0
service_port = 8080
grpc_port = 50051
log_level = INFO
model_dir = ./models
default_model = RandomForest
model_version = 1.0.0
dataset_path = ./data/FlowStatsfile.csv
stats_poll_interval = 10
ddos_threshold_percent = 20.0
legitimate_threshold_percent = 80.0
faucet_host = localhost
faucet_rest_port = 9302
gauge_prometheus_port = 9303
faucet_acl_name = block-malicious
mitigation_duration = 120
mitigation_cooldown = 300
metrics_enabled = true
metrics_port = 9090